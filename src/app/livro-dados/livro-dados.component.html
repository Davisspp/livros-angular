<main class="container mt-4">
  <h1 class="mb-4">Cadastro de Livro</h1>

  <form (submit)="incluir()" ngNativeValidate>

    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" class="form-control" required [(ngModel)]="livro.titulo" name="titulo">
    </div>

    <div class="mb-3">
      <label class="form-label">Resumo</label>
      <textarea class="form-control" [(ngModel)]="livro.resumo" name="resumo"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Editora</label>
      <select class="form-select" required [(ngModel)]="livro.codEditora" name="codEditora">
        <option *ngFor="let editora of editoras" [value]="editora.codEditora">
          {{ editora.nome }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Autores (um por linha)</label>
      <textarea class="form-control" [(ngModel)]="autoresForm" name="autoresForm"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
</main>
